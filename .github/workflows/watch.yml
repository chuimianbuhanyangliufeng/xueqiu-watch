name: xueqiu-watch

on:
  schedule:
    # GitHub Actions cron 为 UTC；北京时间 = UTC + 8
    # 交易日(周一~周五) 北京时间 9:20-14:30，每 15 分钟一次：
    #   9:20 9:35 9:50 → UTC 1 点
    #   10:05 ... 13:50 → UTC 2-5 点
    #   14:05 14:20 14:30 → UTC 6 点
    - cron: "20,35,50 1 * * 1-5"
    - cron: "5,20,35,50 2-5 * * 1-5"
    - cron: "5,20,30 6 * * 1-5"
  workflow_dispatch: {} # 允许手动触发（更新 Cookie 后可立即测试）

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    concurrency:
      group: xueqiu-watch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # 避免拿到的分支落后导致快照回滚
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 拉取自选股并比对
        env:
          XUEQIU_COOKIE: ${{ secrets.XUEQIU_COOKIE }}
          SENDKEY: ${{ secrets.SENDKEY }}
          TARGET_UID: "7143769715"
          SNAPSHOT_FILE: snapshot.json
        run: node index.mjs

      - name: 提交快照
        run: |
          git config user.name "xueqiu-watch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add snapshot.json
          if git diff --cached --quiet; then
            echo "快照无变化，跳过提交"
          else
            git commit -m "chore: 更新自选股快照 [skip ci]"
            git pull --rebase origin "${GITHUB_REF#refs/heads/}" || true
            git push
          fi
